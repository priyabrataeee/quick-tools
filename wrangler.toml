# Cloudflare Workers project, serving the prerendered site as static assets.
#
#   npm run preview   build, then serve locally exactly as Cloudflare will
#   npm run deploy    build, then `wrangler deploy`
#
# There is no `main` entry: this is an assets-only Worker, so Cloudflare serves
# the files directly with no script in the request path.
#
# `name` must match the Worker name in your Cloudflare dashboard. It is kept as
# "quicktools" deliberately — renaming it makes `wrangler deploy` create a new
# Worker, leaving any attached custom domain pointing at the old one.

name = "quicktools"
compatibility_date = "2026-08-01"

# Custom domains can be attached in the dashboard (they persist across deploys),
# or declared here so they live in version control. Uncomment ONLY once the zone
# is active in your Cloudflare account — `wrangler deploy` fails outright if it
# is asked to bind a domain Cloudflare does not yet serve DNS for.
#
# routes = [
#   { pattern = "ondevice-tools.org", custom_domain = true },
#   { pattern = "www.ondevice-tools.org", custom_domain = true },
# ]

[assets]
directory = "./dist/app/browser"

# Serve the prerendered /404 page with a real 404 status for unmatched paths.
# "single-page-application" would return 200 for every URL, which would let
# search engines index broken links.
not_found_handling = "404-page"

# Each route is written as `<path>/index.html`, and canonical tags, JSON-LD and
# the sitemap all use the trailing-slash form (see canonicalUrl() in
# src/app/core/site.config.ts). Forcing the trailing slash keeps the URL we
# publish identical to the one that answers with a 200.
html_handling = "force-trailing-slash"
